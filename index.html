
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1440">
    <title>Verizon Homepage | Design Project</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- TOP UTILITY NAVIGATION -->
    <div class="top-bar">
        <div class="top-bar-left">
            <span class="active-tab">Personal</span>
            <span>Business</span>
        </div>

        <div class="top-bar-right">
            <span>1-833-VERIZON</span>
            <span>Contact us</span>
            <span>Support</span>
            <span>Stores</span>
            <span>Coverage map</span>
            <span>Español</span>
        </div>
    </div>

    <!-- MAIN NAVIGATION -->
    <header class="main-header">

        <div class="logo">
            verizon<span class="logo-check">✓</span>
        </div>

        <nav class="main-nav">
            <span>Mobile <b>⌄</b></span>
            <span>Home <b>⌄</b></span>
            <span>Save <b>⌄</b></span>
        </nav>

        <div class="header-actions">

            <!-- SEARCH ICON -->
            <div class="header-icon">
                <svg viewBox="0 0 24 24" fill="none"
                     stroke="currentColor" stroke-width="1.8">
                    <circle cx="10.8" cy="10.8" r="7.2"/>
                    <path d="M16.3 16.3L22 22"/>
                </svg>
            </div>

            <!-- ACCOUNT ICON -->
            <div class="header-icon">
                <svg viewBox="0 0 24 24" fill="none"
                     stroke="currentColor" stroke-width="1.8">
                    <circle cx="12" cy="7.5" r="4"/>
                    <path d="M4 21c0-5 3.3-8 8-8s8 3 8 8"/>
                </svg>
            </div>

            <!-- SHOPPING BAG ICON -->
            <div class="header-icon">
                <svg viewBox="0 0 24 24" fill="none"
                     stroke="currentColor" stroke-width="1.8">
                    <path d="M4 8h16l-1 13H5L4 8z"/>
                    <path d="M9 9V6a3 3 0 0 1 6 0v3"/>
                </svg>
            </div>

        </div>
    </header>

    <!-- QUICK LINKS -->
    <section class="quick-links">
        <span>Holiday Deals</span>
        <span>Switch to Verizon</span>
        <span>Simplicity Plan</span>
        <span>Home Internet</span>
        <span>Verizon One Mobile + Home</span>
        <span>Bring your phone</span>
    </section>

    <!-- MAIN HOMEPAGE CONTENT -->
    <main id="homepage">
        <!-- Hero section will be added in the next step -->
    </main>

</body>
</html>
